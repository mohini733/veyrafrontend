<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="veyraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded hexagon or shield -->
  <rect x="20" y="20" width="160" height="160" rx="42" fill="#0C1220" stroke="#1E293B" stroke-width="4"/>
  <!-- Glowing Chat Bubble Silhouette -->
  <path d="M60 65 C60 54, 70 45, 82 45 L118 45 C130 45, 140 54, 140 65 L140 105 C140 116, 130 125, 118 125 L95 125 L75 145 L75 125 L82 125 C70 125, 60 116, 60 105 Z" fill="url(#veyraGrad)" filter="url(#glow)"/>
  <!-- Inner Dynamic Modern 'V' Mark -->
  <path d="M82 72 L100 110 L118 72" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Status dot -->
  <circle cx="140" cy="65" r="9" fill="#10B981" stroke="#0C1220" stroke-width="3"/>
</svg>
